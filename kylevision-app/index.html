<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KyleVision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --stage-void: #0f0c25;
        --stage-violet: #1c1740;
        --stage-violet-light: #2c2560;
        --stage-card: #241d4d;
        --paper: #f7f1e4;
        --paper-dim: #cfc7de;
        --spark: #ff4f7e;
        --spark-dim: #b83a5c;
        --gold: #ffcd4a;
        --ok: #6bd68a;
        --text-primary: #f7f1e4;
        --text-secondary: #b6accf;
        --text-muted: #837a9e;
        --border: rgba(247, 241, 228, 0.14);
        --radius: 14px;
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--stage-violet-light) 0%, var(--stage-void) 55%);
        background-attachment: fixed;
        color: var(--text-primary);
        min-height: 100vh;
      }
      h1, h2, h3 {
        font-family: "Anton", "Manrope", sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
        line-height: 1.05;
        margin: 0;
      }
      p { color: var(--text-secondary); line-height: 1.5; }
      button, input, textarea {
        font-family: inherit;
        font-size: 15px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      button {
        background: var(--stage-card);
        color: var(--text-primary);
        cursor: pointer;
        padding: 10px 16px;
        transition: background 120ms ease, transform 80ms ease, border-color 120ms ease;
      }
      button:hover { background: var(--stage-violet-light); border-color: rgba(247,241,228,0.28); }
      button:active { transform: scale(0.98); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      input, textarea {
        background: rgba(15, 12, 37, 0.5);
        color: var(--text-primary);
        padding: 12px 14px;
      }
      input::placeholder, textarea::placeholder { color: var(--text-muted); }
      input:focus, textarea:focus, button:focus-visible {
        outline: 2px solid var(--spark);
        outline-offset: 1px;
      }
      ::selection { background: var(--spark); color: var(--stage-void); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
