<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KyleVision</title>
    <style>
      :root {
        --surface-2: #ffffff;
        --surface-1: #f3f2ed;
        --surface-0: #ebe9e2;
        --text-primary: #1a1a18;
        --text-secondary: #5f5e5a;
        --text-muted: #888780;
        --text-accent: #185fa5;
        --text-success: #27500a;
        --text-danger: #791f1f;
        --border: rgba(0,0,0,0.1);
        --border-accent: #378add;
        --border-success: #639922;
        --border-danger: #e24b4a;
        --bg-success: #eaf3de;
        --bg-danger: #fcebeb;
        --radius: 8px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface-2: #232320;
          --surface-1: #2c2c2a;
          --surface-0: #1a1a18;
          --text-primary: #f1efe8;
          --text-secondary: #b4b2a9;
          --text-muted: #888780;
        }
      }
      body {
        margin: 0;
        background: var(--surface-0);
        color: var(--text-primary);
      }
      button, input {
        font-family: inherit;
        font-size: 14px;
        border-radius: var(--radius);
        border: 0.5px solid var(--border);
        padding: 8px 12px;
      }
      button {
        background: transparent;
        cursor: pointer;
      }
      button:hover { background: var(--surface-1); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      input { background: var(--surface-2); color: var(--text-primary); }
      h1, h2, h3 { font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
